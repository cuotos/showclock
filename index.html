<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showclock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="lcars">
    <!-- top frame -->
    <div class="elbow top"><span>SHOWCLOCK</span></div>
    <div class="topbar">
      <div class="curve top"></div>
      <div class="bar c-peach w20"></div>
      <div class="bar c-lavender w10"></div>
      <div id="clock" class="title">--:--:--</div>
      <div class="bar c-orange cap"></div>
    </div>

    <!-- each row: sidebar heading, then its content -->
    <div class="block c-lavender">NOW<b>01</b></div>
    <div id="now" class="cell">
      <div id="phase-name">—</div>
      <div id="phase-remaining">--:--</div>
    </div>

    <div class="block c-blue">PROGRESS<b>02</b></div>
    <div id="timeline" class="cell">
      <div id="bar"><div id="fill"></div></div>
      <div id="ticks"><span id="tick-start"></span><span id="tick-end"></span></div>
    </div>

    <div class="block c-gold">NEXT<b>03</b></div>
    <div id="next" class="cell">
      <div id="next-name">—</div>
      <div id="next-at"></div>
    </div>

    <div class="block c-sky">LATER<b>04</b></div>
    <div id="later" class="cell"></div>

    <!-- bottom frame -->
    <div class="elbow bottom"><span></span></div>
    <div class="bottombar">
      <div class="curve bottom"></div>
      <div class="key c-blue">E · EDIT</div>
      <div class="key c-gold">F · FULLSCREEN</div>
      <div class="bar c-orange cap grow"></div>
    </div>
  </main>

  <dialog id="editor">
    <form method="dialog">
      <h2>SCHEDULE</h2>
      <p>ONE PHASE PER LINE: <code>HH:MM NAME</code>. LAST LINE IS THE END POINT (E.G. CURFEW).<br>ENTER TO SAVE · SHIFT+ENTER FOR NEW LINE · ESC TO CANCEL</p>
      <textarea id="schedule-text" rows="14" spellcheck="false"></textarea>
      <div id="editor-errors"></div>
      <div class="buttons">
        <button value="cancel" class="c-lavender">CANCEL</button>
        <button id="save" type="button" class="c-orange">SAVE</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
